# Every pull request (and push to main) must pass all jobs before merge (milestone 0A.02-T6).
# Make "checks", "database" and "secret-scan" required status checks in the branch protection rules.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Nightly full run (0A.20-T3/T4): every gate, the whole screenshot matrix and the benchmark on the latest main.
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, config, unit tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Product config and identifier check
        run: npm run check:config
      - name: Translations complete in English and Bangla; no hard-coded UI strings (0A.10)
        run: npm run check:i18n
      - name: Unit tests
        run: npm test
      - name: Web build
        run: npm run export:web
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions typecheck (Deno)
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      # i18n lint, missing keys, label lint and permission manifests run inside `npm run check` (0A.10, 0A.12, 0A.16);
      # the screenshot matrix, role matrix and benchmark run in the database job below (0A.20).

  database:
    name: Migrations on a fresh database + database gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database, auth, REST)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Apply all migrations from zero (without seed)
        run: supabase db reset --no-seed
      - name: Apply extension migrations (0A.09)
        run: npm run db:extensions
      - name: Load module manifests into the permission registry (0A.16)
        run: npm run db:permissions
      - name: Schema lint (0A.04)
        run: npm run lint:schema
      - name: Schema lint catches every rule (fixtures)
        run: npm run test:lint
      - name: Apply all migrations from zero with test seed
        run: supabase db reset
      - name: Apply extension migrations
        run: npm run db:extensions
      - name: Load module manifests into the permission registry (0A.16)
        run: npm run db:permissions
      - name: Bundled default labels match the database (0A.12)
        run: npm run check:labels
      - name: Settings catalog — schema, owner, area permission and bn/en labels for every key (0B.01)
        run: npm run check:settings
      - name: Packs and profiles — files valid, seed up to date, every database row valid (0B.03)
        run: npm run check:profiles -- --db
      - name: Database tests as real roles (0A.03+)
        run: npm run test:db
      - name: Role matrix — every template role × permission × scope (0A.20)
        run: npm run test:role-matrix
      # Slow-down gate (0A.20-T5, D41): compare with the last result from main / the nightly run (Actions cache).
      - name: Restore the benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.run_id }}
          restore-keys: bench-baseline-
      - name: Benchmark — large vs small institution, RLS and can() cost; fails on slow-downs (0A.20)
        run: npm run bench -- --baseline bench-baseline/latest.json --fail-on-slowdown
      - name: Keep this result as the new baseline (main and nightly only)
        if: github.event_name != 'pull_request'
        run: mkdir -p bench-baseline && cp bench-results/latest.json bench-baseline/latest.json
      - name: Save the benchmark baseline
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.run_id }}
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: ignore
      - name: End-to-end tests (real sign-in, hook, RLS through REST, Storage, Realtime)
        run: npm run test:e2e
      - name: Web build connected to the local Supabase
        run: npm run export:web:local
      - name: Install a browser for UI tests (not a project dependency)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: UI tests and the screenshot matrix (every route × light/dark × bn/en × weird labels, 0A.20)
        run: npm run test:ui
      - name: Upload UI screenshots and screenshot diffs (bn/en × light/dark)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore

  leak-test:
    name: cross-tenant leak test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start local Supabase database
        run: supabase db start
      - name: Apply migrations and the test seed
        run: supabase db reset
      - name: Apply extension migrations
        run: bash scripts/apply-extensions.sh
      - name: Load module manifests into the permission registry
        run: npm run db:permissions
      - name: The leak test catches deliberate leaks (self-test)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/leak/leak_selftest.sql
      - name: Cross-tenant leak test (every table and RPC, as members of another institution)
        run: bash scripts/leak-test.sh

  secret-scan:
    name: Secret scan (D27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the repository history
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  deploy-type:
    name: Migration changes declare a database deploy (D27)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- supabase/migrations supabase/extensions | grep -c . || true)
          if [ "$changed" -gt 0 ]; then
            if printf '%s' "$PR_BODY" | grep -Eiq '\[x\] *Database'; then
              echo "Database deploy declared."
            else
              echo "::error::This PR changes migrations. Tick '[x] Database' under 'Deploy type' in the PR description."
              exit 1
            fi
          else
            echo "No migration changes."
          fi
